<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carte avec Turf.js et Leaflet</title>
    <!-- Inclure le CSS de Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

    <!-- Inclure Turf.js -->
    <script src="https://unpkg.com/@turf/turf"></script>
    <!-- Inclure Leaflet JS -->
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

</head>
<body>

    <h1>Calcul de Distance avec Turf.js et Leaflet</h1>
    
    <!-- Conteneur pour la carte -->
    <div id="map" style="height: 600px;"></div>

    <!-- Inclure Leaflet JS -->
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <!-- Inclure Turf.js -->
    <script src="https://unpkg.com/@turf/turf"></script>
    <script>
        // Créer une carte Leaflet
        var map = L.map('map').setView([48.8566, 2.3522], 13); // Coordonnées pour Paris

        // Ajouter les tuiles OpenStreetMap à la carte
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        // Ajouter deux marqueurs à la carte
        var marker1 = L.marker([48.8566, 2.3522]).addTo(map); // Paris
        var marker2 = L.marker([48.8708, 2.2905]).addTo(map); // Paris Gare du Nord

        // Calculez la distance entre les deux marqueurs
        var point1 = turf.point([marker1.getLatLng().lng, marker1.getLatLng().lat]);
        var point2 = turf.point([marker2.getLatLng().lng, marker2.getLatLng().lat]);

        var distance = turf.distance(point1, point2, { units: 'kilometers' });

        // Affichez la distance dans une popup
        marker1.bindPopup("Paris");
        marker2.bindPopup("Gare du Nord");
        marker1.openPopup();

        // Afficher la distance dans la console et une popup
        console.log("La distance entre les deux points est de : " + distance.toFixed(2) + " km");
        marker1.bindPopup("La distance entre Paris et Gare du Nord est de " + distance.toFixed(2) + " km").openPopup();
    </script>
</body>
</html>
