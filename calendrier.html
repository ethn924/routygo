<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Bandeau RoutyGo</title>
  <link rel="stylesheet" href="calendrier.css">
  <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
</head>
<body>

  <div class="search-banner">
    <!-- Partie 1: Destination -->
    <div class="search-section">
      <label for="destination">Destination</label>
      <input type="text" id="destination" placeholder="Où aimeriez-vous aller ?">
    </div>

    <!-- Partie 2: Dates -->
    <div class="search-section">
      <label for="dates">Dates</label>
      <input type="text" id="dates" placeholder="Arrivée → Départ" readonly>
      <div id="calendar-container" style="display: none;">
        <div class="calendar-header">
          <button id="prevMonth">←</button>
          <span id="monthLabel"></span>
          <button id="nextMonth">→</button>
        </div>
        <div class="calendar-grid">
          <div class="calendar-days">
            <div>Lun</div><div>Mar</div><div>Mer</div><div>Jeu</div><div>Ven</div><div>Sam</div><div>Dim</div>
          </div>
          <div id="calendar"></div>
        </div>
      </div>
    </div>

    <!-- Partie 3: Invités -->
    <div class="search-section guests">
      <!-- Titre Nouveaux Invités -->
      <div class="guests-input">
        <label for="new-guests">Nouveaux Invités</label>
        <div class="guests-input-wrapper">
          <input type="text" id="new-guests" placeholder="Entrez le nombre d'invités">
          <!-- Icône Ajouter -->
          <div class="add-icon" id="add-icon">
            <ion-icon name="add-circle"></ion-icon>
          </div>
        </div>
      </div>

      <!-- Section Adultes -->
      <div class="guests-input hidden" id="adults-section">
        <button id="decrease-adults">-</button>
        <input type="text" id="adults" value="1" readonly>
        <button id="increase-adults">+</button>
        <span>Adultes</span>
      </div>

      <!-- Section Enfants -->
      <div class="guests-input hidden" id="kids-section">
        <button id="decrease-kids">-</button>
        <input type="text" id="kids" value="0" readonly>
        <button id="increase-kids">+</button>
        <span>Enfants</span>
      </div>
    </div>

    <!-- Bouton rechercher -->
    <div class="search-btn">
      ➤ Rechercher
    </div>
  </div>

  <script src="calendrier.js"></script>
</body>
</html>
